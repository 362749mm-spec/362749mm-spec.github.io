<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>指数复利实验室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="定投模拟、历史回测和指数比较。用全球主要宽基指数的真实月度数据计算。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)">
<style>
/* 指数复利实验室 · v3 · Xiao luxury minimalism (see DESIGN.md).
   Whitespace first, a hairline second, bg-subtle third. No cards, no shadows except overlays, no gradients.
   Colours come only from the tokens below. Four type sizes: 48 · 18 · 13 · 12. */

/* ================================================================ tokens */
:root {
  /* Xiao colour tokens (light) */
  --bg: #ffffff;
  --bg-subtle: #fafafa;
  --bg-muted: #f4f4f4;
  --bg-elevated: #ffffff;
  --overlay-scrim: #0000003d;
  --line: #ebebeb;
  --line-strong: #d6d6d6;
  --line-control: #8f8f8f;
  --ink: #111111;
  --ink-secondary: #525252;
  --ink-tertiary: #6b6b6b;
  --ink-disabled: #a8a8a8;
  --primary: var(--ink);
  --primary-hover: #2e2e2e;
  --on-primary: #ffffff;
  --accent: #86592d;
  --accent-soft: #f7f1ea;
  --on-accent: #ffffff;
  --success: #2d6a4f;
  --success-soft: #eef6f1;
  --warning: #8a5300;
  --warning-soft: #fbf3e4;
  --danger: #b3261e;
  --danger-soft: #fcefee;
  --gain: var(--success);
  --loss: var(--danger);
  --focus: var(--ink);
  --shadow-overlay: 0 0 0 1px #0000000f, 0 8px 24px -4px #00000014;
  --focus-ring: 0 0 0 2px #ffffff, 0 0 0 3.5px #111111;
  /* chart palette: slot colours, validated against #fff and #0f0f0f */
  --s1: #2f6aa8; --s2: #b0703a; --s3: #139482; --s4: #a8862a; --s5: #9a5288; --s6: #5f8a2e; --s7: #5560b0; --s8: #b5473c;
  --down-blue: #2f6aa8;

  /* type */
  --font-sans: "Anthropic Sans", system-ui, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: "Anthropic Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-hero: 48px; --lh-hero: 56px;

  /* space, shape, motion, layers, layout */
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;
  --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-full: 9999px;
  --duration-fast: 120ms; --duration-base: 200ms; --easing-standard: cubic-bezier(0.2, 0, 0, 1);
  --z-sticky: 100; --z-dropdown: 200; --z-modal: 1000; --z-toast: 1100;
  --nav-height: 56px; --sidenav-width: 240px; --content-width: 1040px;
  --control-height-sm: 28px; --control-height-md: 36px;
  --page-x: 32px; --block-gap: 48px;
  --chart-h: 320px;

  /* up / down: 绿涨红跌 by default; data-updown switches it */
  --pos: var(--gain);
  --neg: var(--loss);

  /* legacy names still read by pages that are not converted yet (and by T() in charts) */
  --surface: var(--bg);
  --sunken: var(--bg-muted);
  --ink-2: var(--ink-secondary);
  --ink-3: var(--ink-tertiary);
  --line-2: var(--line-strong);
  --hover: var(--bg-muted);
  --principal: var(--ink-tertiary);
  --principal-fill: var(--bg-muted);
  --band: var(--bg-muted);
  --mid: var(--bg-muted);
  --amber: var(--s2);
  --blue: var(--s1);
  --accent-ink: var(--on-accent);
  --f-num: var(--font-sans);
  --f-body: var(--font-sans);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f0f0f; --bg-subtle: #151515; --bg-muted: #1c1c1c; --bg-elevated: #1a1a1a; --overlay-scrim: #000000b3;
    --line: #242424; --line-strong: #333333; --line-control: #6e6e6e;
    --ink: #f2f2f2; --ink-secondary: #b0b0b0; --ink-tertiary: #8c8c8c; --ink-disabled: #555555;
    --primary-hover: #d9d9d9; --on-primary: #111111;
    --accent: #d1a878; --accent-soft: #2a2118; --on-accent: #111111;
    --success: #7fc4a0; --success-soft: #13241b; --warning: #e0b061; --warning-soft: #2a2010; --danger: #f2998f; --danger-soft: #2e1614;
    --shadow-overlay: 0 0 0 1px #2e2e2e, 0 8px 24px -4px #00000099;
    --focus-ring: 0 0 0 2px #0f0f0f, 0 0 0 3.5px #f2f2f2;
    --s1: #5288cc; --s2: #bb7c46; --s3: #24998a; --s4: #ab8d36; --s5: #ad669d; --s6: #6b993a; --s7: #7880cc; --s8: #cc6458;
    --down-blue: #5288cc;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f0f0f; --bg-subtle: #151515; --bg-muted: #1c1c1c; --bg-elevated: #1a1a1a; --overlay-scrim: #000000b3;
  --line: #242424; --line-strong: #333333; --line-control: #6e6e6e;
  --ink: #f2f2f2; --ink-secondary: #b0b0b0; --ink-tertiary: #8c8c8c; --ink-disabled: #555555;
  --primary-hover: #d9d9d9; --on-primary: #111111;
  --accent: #d1a878; --accent-soft: #2a2118; --on-accent: #111111;
  --success: #7fc4a0; --success-soft: #13241b; --warning: #e0b061; --warning-soft: #2a2010; --danger: #f2998f; --danger-soft: #2e1614;
  --shadow-overlay: 0 0 0 1px #2e2e2e, 0 8px 24px -4px #00000099;
  --focus-ring: 0 0 0 2px #0f0f0f, 0 0 0 3.5px #f2f2f2;
  --s1: #5288cc; --s2: #bb7c46; --s3: #24998a; --s4: #ab8d36; --s5: #ad669d; --s6: #6b993a; --s7: #7880cc; --s8: #cc6458;
  --down-blue: #5288cc;
  color-scheme: dark;
}
:root[data-updown="rg"] { --pos: var(--loss); --neg: var(--gain); }
:root[data-updown="rb"] { --pos: var(--loss); --neg: var(--down-blue); }
html[data-device="phone"] { --fs-hero: 40px; --lh-hero: 48px; --page-x: max(24px, env(safe-area-inset-left, 0px)); --block-gap: 32px; --chart-h: 240px; }

/* ================================================================ base */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 20px; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
:focus { outline: none; }
:focus-visible { outline: 2px solid transparent; box-shadow: var(--focus-ring); }
.tok:focus-visible, .gl:focus-visible, .link-btn:focus-visible, details.more > summary:focus-visible { border-radius: var(--radius-sm); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.num, .tnum { font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.muted { color: var(--ink-tertiary); }
.nw, .nb { white-space: nowrap; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; vertical-align: 0.06em; }
svg { flex: none; }

/* ================================================================ shell */
.navbar { position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-sticky); height: var(--nav-height); display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--space-4) 0 var(--page-x); background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { border: 0; background: none; padding: 0; font-size: 15px; line-height: 24px; font-weight: 500; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
.nav-actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-1); }
.navbar .menu-btn { display: none; margin-left: calc(-1 * var(--space-2)); }
html[data-device="tablet"] .navbar .menu-btn { display: inline-flex; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-secondary);
  transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard); }
.icon-btn:hover { background: var(--bg-muted); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.nav-actions .btn .ico { display: none; }
html[data-device="phone"] .nav-actions .btn { width: 36px; padding: 0; }
html[data-device="phone"] .nav-actions .btn .ico { display: inline-flex; }
html[data-device="phone"] .nav-actions .btn .lbl { display: none; }
.nav-actions .btn .ico svg { width: 20px; height: 20px; }

.sidenav { position: fixed; top: var(--nav-height); left: 0; bottom: 0; width: var(--sidenav-width); overflow-y: auto; overscroll-behavior: contain;
  background: var(--bg-subtle); padding: var(--space-5) var(--space-3) var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); z-index: var(--z-sticky); }
.sn-label { padding: 0 var(--space-3) var(--space-2); font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); margin: 0; }
.sn-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.sn-item { display: flex; align-items: center; width: 100%; height: 32px; padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: none; text-align: left;
  font-size: 13px; line-height: 20px; color: var(--ink-secondary); transition: background-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard); }
.sn-item:hover { background: var(--bg-muted); color: var(--ink); }
.sn-item[aria-current="page"] { background: var(--bg-muted); color: var(--ink); font-weight: 500; }
html[data-device="tablet"] .sidenav, html[data-device="phone"] .sidenav { display: none; }
html[data-device="tablet"].nav-open .sidenav { display: flex; top: 0; z-index: calc(var(--z-modal) + 1); background: var(--bg-elevated); box-shadow: var(--shadow-overlay); padding-top: var(--space-5);
  animation: x-fade var(--duration-base) var(--easing-standard); }
.sn-head { display: none; align-items: center; justify-content: space-between; padding: 0 0 0 var(--space-3); margin-bottom: calc(-1 * var(--space-2)); }
html.nav-open .sn-head { display: flex; }

.main-col { padding-top: var(--nav-height); min-height: 100vh; display: flex; flex-direction: column; }
html[data-device="desktop"] .main-col { margin-left: var(--sidenav-width); }
.view { width: 100%; max-width: calc(var(--content-width) + 2 * var(--page-x)); padding: 0 var(--page-x) var(--space-8); flex: 1; }
.loading { color: var(--ink-tertiary); padding: var(--space-8) 0; }
.footer { width: 100%; max-width: calc(var(--content-width) + 2 * var(--page-x)); padding: var(--space-5) var(--page-x) var(--space-6); font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary);
  display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-2); align-items: center; }
.footer .link-btn { font-size: 12px; line-height: 16px; padding: 0; }
html[data-device="phone"] .footer { padding-bottom: calc(var(--space-6) + 56px + env(safe-area-inset-bottom, 0px)); }

.tabbar { display: none; }
html[data-device="phone"] .tabbar { display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: var(--z-sticky);
  padding: 0 var(--space-2) env(safe-area-inset-bottom, 0px); background: var(--bg); border-top: 1px solid var(--line); }
.tabbar button { border: 0; background: none; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; line-height: 16px; color: var(--ink-tertiary); border-radius: var(--radius-sm); }
.tabbar button svg { width: 20px; height: 20px; }
.tabbar button[aria-current="page"] { color: var(--ink); font-weight: 500; }

/* the result, kept in view while the page scrolls */
.mini { position: fixed; z-index: calc(var(--z-sticky) - 1); top: var(--nav-height); left: 0; right: 0; height: 36px; display: flex; align-items: center; gap: var(--space-3);
  padding: 0 var(--page-x); background: var(--bg); border: 0; border-bottom: 1px solid var(--line); text-align: left; font-size: 12px; line-height: 16px; color: var(--ink-tertiary); white-space: nowrap; overflow: hidden; }
html[data-device="desktop"] .mini { left: var(--sidenav-width); }
.mini b { color: var(--ink); font-size: 13px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.mini span:last-child { overflow: hidden; text-overflow: ellipsis; }

/* ================================================================ page */
.panel { display: none; }
.panel.active { display: block; }
.page-head { display: flex; align-items: center; gap: var(--space-1); padding-top: var(--space-6); }
html[data-device="phone"] .page-head { padding-top: var(--space-5); }
.page-title { margin: 0; font-size: 18px; line-height: 26px; font-weight: 500; letter-spacing: -0.01em; }
.page-head .gl { margin-left: var(--space-1); }

/* params row: label over value */
.params { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-1) var(--space-3); margin: var(--space-4) 0 0 calc(-1 * var(--space-2)); }
.param { display: inline-flex; flex-direction: column; align-items: flex-start; min-height: 40px; padding: 2px var(--space-2); border: 0; border-radius: var(--radius-sm); background: none; text-align: left;
  transition: background-color var(--duration-fast) var(--easing-standard); }
.param:hover { background: var(--bg-muted); }
.param-l { font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); white-space: nowrap; }
.param-v { font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums;
  text-decoration: underline 1.5px transparent; text-underline-offset: 5px; transition: text-decoration-color var(--duration-fast) var(--easing-standard); }
.param[aria-expanded="true"] .param-v { text-decoration-color: var(--accent); }
.param-more { display: inline-flex; align-items: center; gap: 2px; height: 36px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: none;
  font-size: 13px; line-height: 20px; color: var(--ink-secondary); white-space: nowrap; }
.param-more:hover { background: var(--bg-muted); color: var(--ink); }
.param-more svg { width: 16px; height: 16px; }

/* legacy sentence with tokens (pages not converted yet) */
.ask { font-size: 18px; line-height: 36px; margin: var(--space-4) 0 0; color: var(--ink); }
.ask p { margin: 0; }
.tok { display: inline; border: 0; border-bottom: 1px solid var(--line-strong); margin: 0 2px; padding: 0 2px; border-radius: 0; background: none; color: var(--ink);
  font-size: inherit; line-height: inherit; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; transition: background-color var(--duration-fast) var(--easing-standard); }
.tok:hover { background: var(--bg-muted); }
.tok[aria-expanded="true"] { border-bottom: 1.5px solid var(--accent); }

/* result: label, one big number, a signed delta, up to four metrics */
.result, .answer { margin-top: var(--block-gap); }
.r-label, .a-label { margin: 0; font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.r-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--space-4); margin-top: var(--space-1); }
.r-num, .a-num { font-size: var(--fs-hero); line-height: var(--lh-hero); font-weight: 500; letter-spacing: -0.025em; color: var(--ink); }
.r-num.text { font-size: 18px; line-height: 26px; letter-spacing: -0.01em; }
.r-delta { font-size: 13px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.metrics, .trio { display: flex; flex-wrap: wrap; gap: var(--space-4) var(--space-7); margin: var(--space-5) 0 0; }
.metrics > div, .trio > div { min-width: 0; }
.metrics dt, .trio dt { font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.metrics dd, .trio dd { margin: var(--space-1) 0 0; font-size: 18px; line-height: 26px; font-weight: 500; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.trio dd small { display: block; font-size: 12px; line-height: 16px; letter-spacing: .01em; font-weight: 400; color: var(--ink-tertiary); white-space: normal; }
html[data-device="phone"] .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--space-5); }
html[data-device="phone"] .trio { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4) var(--space-5); }
/* legacy answer pieces */
.a-num { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--space-1); margin-top: var(--space-1); }
.a-num.text { font-size: 32px; line-height: 40px; letter-spacing: -0.02em; }
html[data-device="phone"] .a-num.text { font-size: 18px; line-height: 26px; letter-spacing: -0.01em; }
.a-sub { margin: var(--space-2) 0 0; font-size: 13px; line-height: 20px; color: var(--ink); }
.a-note { margin: var(--space-1) 0 0; font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
.a-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-4); margin-top: var(--space-4); }
.flash { animation: flash var(--duration-base) var(--easing-standard); }
@keyframes flash { from { opacity: .4; } to { opacity: 1; } }

/* basis line: facts the number depends on */
.basis, .assume { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) 0; margin: var(--space-3) 0 0; font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.basis > span:not(.badge) + span:not(.badge)::before, .assume > span + span::before { content: "·"; margin: 0 var(--space-2); }
.basis .badge { margin-left: var(--space-2); }
.assume .link-btn { margin-left: var(--space-3); font-size: 12px; line-height: 16px; }

/* chart block: no card, no title (or ≤ 6 characters), readout row doubles as the legend */
.cblock, .card { margin-top: var(--block-gap); }
.c-head, .card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2) var(--space-4); flex-wrap: wrap; min-height: 28px; }
.c-title { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink); }
.c-tools, .card-tools { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); min-width: 0; max-width: 100%; }
.card-title { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink); }
.card-sub { margin: var(--space-1) 0 0; font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.readout { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-4); min-height: 20px; margin: var(--space-3) 0 0; font-size: 12px; line-height: 16px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.readout .ro-t { order: 99; margin-left: auto; color: var(--ink-tertiary); white-space: nowrap; }
.readout .ro-i { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.readout .ro-i .num { color: var(--ink); font-size: 13px; line-height: 20px; font-weight: 500; }
.readout .ro-i.muted { color: var(--ink-tertiary); }
.key { display: inline-block; width: 8px; height: 8px; border-radius: var(--radius-full); flex: none; }
.ro-i .key + .key { margin-left: -4px; }
.key.line { width: 12px; height: 2px; border-radius: 1px; }
.key.dash { width: 12px; height: 0; border-radius: 0; border-top: 1px dashed var(--ink-tertiary); background: none !important; }
.key.area { width: 12px; height: 8px; border-radius: 2px; }
.chart { width: 100%; height: var(--chart-h); margin-top: var(--space-2); }
.chart.tall { height: var(--chart-h); }
.chart.short { height: 240px; }
html[data-device="phone"] .chart.short { height: 200px; }
.note { margin: var(--space-2) 0 0; font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.empty { margin: var(--space-4) 0 0; font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
/* legacy warning box → one quiet line with a badge */
.warn { display: block; margin-top: var(--space-3); font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
.warn::before { content: "注意"; display: inline-flex; vertical-align: 1px; margin-right: var(--space-2); align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); background: var(--warning-soft); color: var(--warning); font-size: 12px; line-height: 16px; font-weight: 500; }
.warn:empty { display: none; }
.warn .link-btn { padding: 0; margin-left: var(--space-1); }

/* badges */
.badge { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border-radius: var(--radius-sm); font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; white-space: nowrap; background: var(--bg-muted); color: var(--ink-secondary); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.success { background: var(--success-soft); color: var(--success); }
.badge.warning { background: var(--warning-soft); color: var(--warning); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }

/* disclosure rows: hairline-separated, content built only when open */
.discs { margin-top: var(--block-gap); }
details.more { border-bottom: 1px solid var(--line); }
details.more:first-child, :not(details.more) + details.more { border-top: 1px solid var(--line); }
.card details.more, .cblock details.more { margin-top: var(--space-4); }
details.more > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 48px; padding: var(--space-3) 0;
  font-size: 13px; line-height: 20px; color: var(--ink); cursor: pointer; border-radius: var(--radius-sm); transition: color var(--duration-fast) var(--easing-standard); }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: ""; flex: none; width: 6px; height: 6px; margin-right: 6px; border-right: 1.5px solid var(--ink-tertiary); border-bottom: 1.5px solid var(--ink-tertiary);
  transform: rotate(-45deg); transition: transform var(--duration-fast) var(--easing-standard); }
details.more[open] > summary::after { transform: rotate(45deg); }
details.more > summary:hover::after { border-color: var(--ink); }
details.more > .more-body { padding: 0 0 var(--space-6); }
.sub-title { margin: var(--space-5) 0 var(--space-2); font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink); }
.more-body > .sub-title:first-child, .more-body > :first-child .sub-title:first-child { margin-top: var(--space-1); }

/* ================================================================ controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-height-md); padding: 0 var(--space-4); border-radius: var(--radius-md);
  border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap;
  transition: background-color var(--duration-fast) var(--easing-standard), border-color var(--duration-fast) var(--easing-standard), color var(--duration-fast) var(--easing-standard); }
.btn:hover:not(:disabled) { background: var(--bg-muted); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-secondary); }
.btn.ghost:hover:not(:disabled) { background: var(--bg-muted); color: var(--ink); }
.btn.ghost[aria-pressed="true"] { background: var(--bg-muted); color: var(--ink); }
.btn.sm { height: var(--control-height-sm); padding: 0 var(--space-3); border-radius: var(--radius-sm); }
.btn svg { width: 16px; height: 16px; }
.btn.sm svg { width: 12px; height: 12px; }
.btn:disabled { cursor: not-allowed; background: var(--bg-subtle); border-color: var(--line); color: var(--ink-disabled); }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-4); }
.link-btn { display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; padding: var(--space-1) 0; font-size: 13px; line-height: 20px; color: var(--ink-secondary); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.link-btn:hover { color: var(--ink); text-decoration-color: var(--ink); }
.link-btn svg { width: 14px; height: 14px; }

/* tabs (view switches on the page) */
.seg { display: inline-flex; gap: var(--space-4); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; flex: none; border: 0; background: none; padding: var(--space-1) 0 var(--space-2); font-size: 13px; line-height: 20px; font-weight: 500; color: var(--ink-tertiary); white-space: nowrap; border-radius: var(--radius-sm);
  transition: color var(--duration-fast) var(--easing-standard); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { color: var(--ink); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px; background: var(--ink); }
.seg button:disabled { color: var(--ink-disabled); cursor: not-allowed; }
/* inside sheets and popovers: a radio group */
.sheet .seg, .pop .seg { display: flex; flex-wrap: wrap; gap: 0 var(--space-5); overflow: visible; }
.sheet .seg button, .pop .seg button { display: inline-flex; align-items: center; gap: var(--space-2); padding: var(--space-2) 0; min-height: 36px; font-weight: 400; color: var(--ink); }
.sheet .seg button::before, .pop .seg button::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: var(--radius-full); border: 1px solid var(--line-control); background: var(--bg-elevated); box-sizing: border-box;
  transition: border-color var(--duration-fast) var(--easing-standard), box-shadow var(--duration-fast) var(--easing-standard); }
.sheet .seg button[aria-pressed="true"]::before, .pop .seg button[aria-pressed="true"]::before { border-color: var(--primary); background: var(--primary); box-shadow: inset 0 0 0 4px var(--bg-elevated); }
.sheet .seg button[aria-pressed="true"]::after, .pop .seg button[aria-pressed="true"]::after { display: none; }

/* chips: compare tags and choice chips */
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chips.scroll { flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: var(--control-height-sm); padding: 0 var(--space-2); border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--bg);
  color: var(--ink); font-size: 13px; line-height: 20px; white-space: nowrap; flex: none; transition: border-color var(--duration-fast) var(--easing-standard), background-color var(--duration-fast) var(--easing-standard); }
.chip:hover { background: var(--bg-muted); }
.chip[aria-pressed="true"] { border-color: var(--ink); font-weight: 500; }
.chip.ghost { border-color: transparent; color: var(--ink-secondary); }
.chip.ghost:hover { color: var(--ink); }
.chip svg { width: 12px; height: 12px; }
.cmp { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-4); align-items: center; }
.cmp-label { font-size: 12px; line-height: 16px; color: var(--ink-tertiary); margin-right: var(--space-1); }
.cmp-chip { border-color: transparent; background: var(--bg-muted); padding-right: 0; cursor: default; }
.cmp-chip:hover { background: var(--bg-muted); }
.cmp-chip .x { border: 0; background: none; height: 100%; width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-tertiary); font-size: 14px; border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
.cmp-chip .x:hover { color: var(--ink); background: var(--line); }

/* fields inside sheets and popovers */
.group { padding: var(--space-4) 0; }
.group + .group, .group + .btn-row { border-top: 1px solid var(--line); }
.group + .btn-row { padding-top: var(--space-4); }
.group-title { margin: 0 0 var(--space-2); font-size: 12px; line-height: 16px; letter-spacing: .01em; font-weight: 400; color: var(--ink-tertiary); }
.field { padding: var(--space-2) 0; }
.f-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 36px; }
.f-row > label, .f-row > .lab { flex: 1; min-width: 0; font-size: 13px; line-height: 20px; color: var(--ink); }
.field > .lab { display: block; font-size: 13px; line-height: 20px; color: var(--ink); margin-bottom: var(--space-1); }
.hint, .opt-hint { margin: var(--space-1) 0 0; font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.opt-hint:empty { display: none; }
.numin { display: inline-flex; align-items: center; height: var(--control-height-md); border: 1px solid var(--line-control); border-radius: var(--radius-md); background: var(--bg-elevated); overflow: hidden; flex: none;
  transition: border-color var(--duration-fast) var(--easing-standard); }
.numin:hover { border-color: var(--ink-tertiary); }
.numin:focus-within { border-color: var(--ink); }
.numin input { width: 88px; border: 0; outline: 0; background: none; text-align: right; padding: 0 var(--space-1) 0 var(--space-3); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; height: 100%; }
.numin input:focus-visible { box-shadow: none; }
.numin.wide input { width: 120px; }
.numin .suf { color: var(--ink-tertiary); font-size: 12px; padding-right: var(--space-3); white-space: nowrap; }
.step { border: 0; background: none; width: 32px; height: 100%; color: var(--ink-secondary); font-size: 16px; line-height: 1; flex: none; }
.step:hover { background: var(--bg-muted); color: var(--ink); }
.step:first-child { border-right: 1px solid var(--line); }
.step:last-child { border-left: 1px solid var(--line); }
select, input[type="month"], .share-url { height: var(--control-height-md); border: 1px solid var(--line-control); border-radius: var(--radius-md); background: var(--bg-elevated); padding: 0 var(--space-3); font-size: 13px; max-width: 100%; color: var(--ink); }
select:hover, input[type="month"]:hover { border-color: var(--ink-tertiary); }
select:focus-visible, input[type="month"]:focus-visible { border-color: var(--ink); }
.switch { position: relative; width: 32px; height: 18px; flex: none; }
.switch input { position: absolute; inset: -9px -4px; width: calc(100% + 8px); height: calc(100% + 18px); opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border: 1px solid var(--line-control); border-radius: var(--radius-full); background: var(--bg-elevated);
  transition: background-color var(--duration-base) var(--easing-standard), border-color var(--duration-base) var(--easing-standard); }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 12px; height: 12px; border-radius: var(--radius-full); background: var(--ink-tertiary);
  transition: transform var(--duration-base) var(--easing-standard), background-color var(--duration-base) var(--easing-standard); }
.switch input:checked + span { background: var(--primary); border-color: var(--primary); }
.switch input:checked + span::after { transform: translateX(14px); background: var(--on-primary); }
.switch input:focus-visible + span { box-shadow: var(--focus-ring); }
.switch input:disabled + span { border-color: var(--line); background: var(--bg-subtle); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-5); }
html[data-device="phone"] .grid2 { grid-template-columns: 1fr; }
.grid2 .numin input { width: 48px; padding-left: var(--space-1); }
.grid2 .f-row > label { white-space: nowrap; }

/* token editor */
.tok-body .presets { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4); }
.tok-body .exact { display: flex; align-items: center; gap: var(--space-3); }
.tok-body .exact .lab { font-size: 12px; line-height: 16px; color: var(--ink-tertiary); }
.tok-body .hint { margin-top: var(--space-3); }
.opt-list { display: flex; flex-direction: column; margin: 0 calc(-1 * var(--space-2)); }
.opt { flex: none; display: flex; align-items: center; gap: var(--space-3); border: 0; background: none; text-align: left; padding: var(--space-2); border-radius: var(--radius-sm); min-height: 40px; width: 100%;
  transition: background-color var(--duration-fast) var(--easing-standard); }
.opt:hover { background: var(--bg-muted); }
.opt .t { flex: 1; min-width: 0; }
.opt .t b { display: block; font-weight: 400; font-size: 13px; line-height: 20px; color: var(--ink); }
.opt .t small { display: block; color: var(--ink-tertiary); font-size: 12px; line-height: 16px; }
.opt .chk { width: 16px; height: 16px; color: var(--accent); visibility: hidden; }
.opt[aria-selected="true"] .chk { visibility: visible; }
.opt[aria-selected="true"] .t b { font-weight: 500; }
.opt-group { font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); padding: var(--space-3) var(--space-2) var(--space-1); }

/* ================================================================ overlays: modal / bottom sheet / popover / toast */
.scrim { position: fixed; inset: 0; z-index: var(--z-modal); background: var(--overlay-scrim); animation: x-fade var(--duration-base) var(--easing-standard); }
.scrim.light { background: var(--overlay-scrim); }
.sheet { position: fixed; z-index: calc(var(--z-modal) + 1); background: var(--bg-elevated); box-shadow: var(--shadow-overlay); display: flex; flex-direction: column; color: var(--ink); }
html:not([data-device="phone"]) .sheet { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 48px)); max-height: min(720px, calc(100vh - 96px)); border-radius: var(--radius-lg);
  animation: x-fade var(--duration-base) var(--easing-standard); }
html[data-device="phone"] .sheet { left: 0; right: 0; bottom: 0; max-height: 88vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: slideup var(--duration-base) var(--easing-standard); }
html[data-device="phone"] .sheet.compact { max-height: 72vh; }
@keyframes x-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideup { from { transform: translateY(24px); opacity: 0; } }
.grab { display: none; }
html[data-device="phone"] .grab { display: block; flex: none; width: 32px; height: 4px; margin: var(--space-2) auto 0; border-radius: var(--radius-full); background: var(--line-strong); box-sizing: content-box; padding: 4px 40px 0; background-clip: content-box; }
html[data-device="phone"] .grab, html[data-device="phone"] .sheet-head { touch-action: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-5) var(--space-4) var(--space-2) var(--space-6); flex: none; }
html[data-device="phone"] .sheet-head { padding: var(--space-3) var(--space-3) var(--space-1) var(--space-5); }
.sheet-head h3 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 500; letter-spacing: -0.01em; }
.sheet-body { overflow-y: auto; overscroll-behavior: contain; padding: 0 var(--space-6) var(--space-6); -webkit-overflow-scrolling: touch; }
html[data-device="phone"] .sheet-body { padding: 0 var(--space-5) var(--space-5); }
.sheet-body > .group:first-child { padding-top: var(--space-2); }
.pop { position: absolute; z-index: var(--z-dropdown); width: 320px; max-width: calc(100vw - 24px); background: var(--bg-elevated); border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
  padding: var(--space-4); display: flex; flex-direction: column; overflow: hidden; animation: x-fade var(--duration-fast) var(--easing-standard); }
.pop.wide { width: 360px; }
.pop .tok-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 calc(-1 * var(--space-4)) calc(-1 * var(--space-4)); padding: 0 var(--space-4) var(--space-4); overscroll-behavior: contain; }
.pop .pop-title { flex: none; margin: 0 0 var(--space-3); font-size: 12px; line-height: 16px; color: var(--ink-tertiary); }
.pop > p:not(.pop-title) { font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
.toast { position: fixed; right: var(--space-5); bottom: var(--space-5); z-index: var(--z-toast); display: flex; align-items: center; gap: var(--space-3); min-height: 48px; max-width: calc(100vw - 32px);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-lg); background: var(--bg-elevated); box-shadow: var(--shadow-overlay); color: var(--ink); font-size: 13px; line-height: 20px;
  animation: x-fade var(--duration-base) var(--easing-standard); }
.toast::before { content: ""; flex: none; width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--ink-tertiary); }
html[data-device="phone"] .toast { right: auto; left: 50%; transform: translateX(-50%); bottom: calc(64px + env(safe-area-inset-bottom, 0px)); white-space: nowrap; }

/* ================================================================ data display */
.tbl-wrap { overflow-x: auto; margin-top: var(--space-2); -webkit-overflow-scrolling: touch; }
.tbl-scroll { max-height: 440px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 20px; color: var(--ink); }
th { font-size: 12px; line-height: 16px; font-weight: 400; letter-spacing: .01em; color: var(--ink-tertiary); text-align: right; padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line-strong);
  white-space: nowrap; position: sticky; top: 0; background: var(--bg); z-index: 1; }
td { padding: var(--space-2) var(--space-4); border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { padding-left: 0; text-align: left; }
th:last-child, td:last-child { padding-right: 0; }
td.txt, td:first-child { font-family: var(--font-sans); }
td small { font-family: var(--font-sans); color: var(--ink-tertiary); font-size: 12px; }
tbody tr:hover td { background: var(--bg-subtle); }
.tbl-wrap td:first-child, .tbl-wrap th:first-child { position: sticky; left: 0; z-index: 2; background: var(--bg); }
.tbl-wrap tbody tr:hover td:first-child { background: var(--bg-subtle); }

.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-6); margin: var(--space-2) 0 0; }
html[data-device="phone"] .kv { grid-template-columns: 1fr; }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--line); min-width: 0; }
.kv dt { font-size: 13px; line-height: 20px; color: var(--ink-secondary); display: flex; align-items: center; gap: 2px; }
.kv dd { margin: 0; font-size: 13px; line-height: 20px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.kv dd small { display: block; font-weight: 400; color: var(--ink-tertiary); font-size: 12px; line-height: 16px; }

.rank { margin: var(--space-3) 0 0; padding: 0; list-style: none; }
.rank li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-4); align-items: center; padding: var(--space-3) 0; border-bottom: 1px solid var(--line); }
.rank .nm { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-weight: 500; }
.rank .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .val { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.rank .meta { grid-column: 1 / -1; font-size: 12px; line-height: 16px; color: var(--ink-tertiary); padding-left: var(--space-4); }
.rank .meta b { font-weight: 500; }
.bar-track { height: 4px; border-radius: var(--radius-full); background: var(--bg-muted); overflow: hidden; grid-column: 1 / -1; margin-left: var(--space-4); }
.bar-track i { display: block; height: 100%; border-radius: var(--radius-full); }
.pill { display: inline-flex; align-items: center; justify-content: flex-end; min-width: 72px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink); }

.prose { max-width: 680px; }
.prose h3 { font-size: 13px; line-height: 20px; font-weight: 500; margin: var(--space-5) 0 var(--space-1); }
.prose h3:first-child { margin-top: var(--space-1); }
.prose p, .prose li { font-size: 13px; line-height: 20px; color: var(--ink-secondary); }
.prose ul { padding-left: var(--space-4); margin: var(--space-2) 0; }
.prose li { margin: var(--space-1) 0; }
.prose code { font-family: var(--font-mono); font-size: 12px; background: var(--bg-muted); padding: 0 4px; border-radius: var(--radius-sm); }
.formula { font-family: var(--font-mono); background: var(--bg-subtle); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); margin: var(--space-2) 0; font-size: 13px; color: var(--ink); }
.gloss dt { font-weight: 500; margin-top: var(--space-3); }
.gloss dd { margin: var(--space-1) 0 0; color: var(--ink-secondary); }
.points { margin: var(--space-2) 0 0; padding: 0; list-style: none; }
.points li { padding: var(--space-2) 0; border-bottom: 1px solid var(--line); color: var(--ink-secondary); }

/* glossary ⓘ */
.gl { position: relative; border: 0; background: none; padding: 0 2px; color: var(--ink-tertiary); font-size: 12px; line-height: 16px; vertical-align: baseline; border-radius: var(--radius-sm); }
.gl:hover { color: var(--ink); }
.gl::before { content: ""; position: absolute; inset: -10px -8px; }
.gl-inline { margin: var(--space-2) 0 0; }
.gl-inline b { color: var(--ink); font-weight: 500; }

/* ================================================================ the 全部 page (phone) and other page pieces */
.alist { list-style: none; margin: 0; padding: 0; }
.alist-label { margin: var(--space-6) 0 var(--space-2); font-size: 12px; line-height: 16px; letter-spacing: .01em; color: var(--ink-tertiary); }
.alist li { border-bottom: 1px solid var(--line); }
.alist li:first-child { border-top: 1px solid var(--line); }
.alist button { display: flex; align-items: center; gap: var(--space-4); width: 100%; min-height: 56px; padding: var(--space-3) 0; border: 0; background: none; text-align: left; color: var(--ink); }
.alist button:hover { background: var(--bg-subtle); }
.alist .t { flex: 1; font-size: 15px; line-height: 24px; }
